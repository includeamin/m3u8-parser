name: prepare release

# Bumps the version, commits, tags and pushes using cargo-release, then starts
# the `release` workflow for the new tag. Tags pushed with the default token do
# not trigger other workflows, so the publish run is started explicitly.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version or bump level (patch, minor, major, or e.g. 0.8.0)
        required: true
        type: string

permissions:
  contents: write
  actions: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-release
      - name: Run tests
        run: cargo test
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Bump version, commit, tag and push
        run: cargo release "$VERSION" --execute --no-confirm
        env:
          VERSION: ${{ inputs.version }}
      - name: Start the publish workflow
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          gh workflow run release.yml -f tag="v$version"
        env:
          GH_TOKEN: ${{ github.token }}
